name: Update prices

on:
  schedule:
    - cron: '17 22 * * 1-5'   # weekdays, after European and Asian markets close
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch closing prices
        run: node scripts/fetch-prices.mjs
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "desire-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Update closing prices"
          git push
